[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfem-learning"
version = "0.1.0a1"
description = "Official scientific-learning providers and references for AgentFEM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Haoming Luo"}]
keywords = ["finite-element", "scientific-machine-learning", "pinn", "neural-operator", "xdem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "agentfem>=0.2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
xdem = ["torch>=2.0,<3"]
test = ["pytest>=8", "ruff>=0.9", "torch>=2.0,<3"]

[project.entry-points."agentfem.extensions"]
"agentfem-learning.xdem" = "agentfem_learning.neural_fields.xdem.extension:extension"

[project.urls]
Homepage = "https://github.com/haoming-luo/agentfem-learning"
AgentFEM = "https://github.com/haoming-luo/agentfem"
Upstream-XDEM = "https://github.com/yizheng-wang/XDEM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
