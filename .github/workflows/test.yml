name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  xdem-reference:
    runs-on: ubuntu-latest
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out AgentFEM-Learning
        uses: actions/checkout@v6

      - name: Create scientific Python environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-learning-dev
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build immutable core and companion wheels
        run: |
          git clone --depth 1 https://github.com/haoming-luo/agentfem.git ../agentfem
          python -m build --wheel --outdir /tmp/agentfem-core-dist ../agentfem
          python -m build --wheel --outdir /tmp/agentfem-learning-dist .

      - name: Install the exact wheels under test
        run: |
          python -m pip install --no-deps --force-reinstall /tmp/agentfem-core-dist/*.whl
          python -m pip install --no-deps --force-reinstall /tmp/agentfem-learning-dist/*.whl

      - name: Check source and package
        run: |
          python -m ruff check src tests examples --no-cache
          python -m build --sdist
          python -m twine check dist/*

      - name: Run provider and evidence tests
        run: python -m pytest

      - name: Verify installed discovery and reference outside both repositories
        run: |
          cd /tmp
          python -m agentfem.cli extensions --json
          python "$GITHUB_WORKSPACE/examples/mode_iii_tip/case.py" --output /tmp/agentfem-learning-reference
          python "$GITHUB_WORKSPACE/examples/vector_mixed_mode_tip/case.py"
          python -m agentfem.cli extensions --load agentfem-learning.xdem --json
          python "$GITHUB_WORKSPACE/acceptance_gate.py" \
            /tmp/agentfem-learning-reference/result.json \
            --core-wheel /tmp/agentfem-core-dist/*.whl \
            --extension-wheel /tmp/agentfem-learning-dist/*.whl \
            --core-commit "$(git -C "$GITHUB_WORKSPACE/../agentfem" rev-parse HEAD)" \
            --companion-commit "$GITHUB_SHA" \
            --report /tmp/agentfem-extension-acceptance.json

      - name: Upload extension acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-extension-acceptance
          path: /tmp/agentfem-extension-acceptance.json
          if-no-files-found: warn
